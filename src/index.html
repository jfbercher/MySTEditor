<!doctype html>
<html lang="en">

<head>
  <title>MyST editor</title>
  <link rel="stylesheet" href="./styles/MystEditor.css" />
  <link rel="stylesheet" href="./styles/editor-tabs.css" />
  <link rel="icon" href="data:," />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #myst { width: 100%; height: 100%; min-width: 0; min-height: 0; }
    myst-editor {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      height: 100% !important;
      box-sizing: border-box;
    }
  </style>

  <script type="module">
    import { loadConfig } from "./config.js";
    import { TabManager } from "./tab_manager.js";

    // Dynamic configuration available right here in index.html
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get("username") || Math.floor(Math.random() * 1000).toString();

    const exampleCustomRoles = [
      { target: "say", transform: async (content) => username + " says: '" + content + "'" },
    ];

    const exampleCustomDirectives = [
      { target: "bold", transform: (_, data) => `<b style="white-space: pre-wrap;">${data.body}</b>` },
      { target: "Title", transform: (_, data) => `<H1 class="myst-editor-title">${data.body}</H1>` },
    ];

    const exampleTransforms = [
      {
        target: /[0-9a-z\-]+\/[0-9a-z\-]+#\d{1,10}/g,
        transform: (match) => {
          const [repo, issueId] = match.split("#");
          return `<a href="https://github.com/${repo}/issues/${issueId}">${match}</a>`;
        },
      },
      {
        target: /[0-9a-z\-]+\/[0-9a-z\-]+\!\d+/g,
        transform: (match) => match,
      },
      {
        target: /(^|(?<=\s))#\d+/g,
        transform: (match) => `<a href="https://github.com/antmicro/myst-editor/issues/${match.slice(1)}">${match}</a>`,
      },
      {
        target: /(^|(?<=\s))!\d+/g,
        transform: (match) => `<a href="https://github.com/antmicro/myst-editor/pull/${match.slice(1)}">${match}</a>`,
      },
      {
        target: /\|date\|/g,
        transform: (match) => new Promise((r) => r(new Date().toLocaleString("en-GB", { timeZone: "UTC" }))),
      },
    ];

  async function initApp() {
    await loadConfig();
    // Initialize tab manager with your custom directives/roles
    const tabManager = new TabManager({
      customRoles: exampleCustomRoles,
      customDirectives: exampleCustomDirectives,
      transforms: exampleTransforms,
    });

    await tabManager.init();
    }

  initApp();

  </script>
</head>

<body style="margin: 0; height: 100vh; overflow: hidden;">
  <div id="myst-css-namespace" style="display: flex; flex-direction: column; height: 100vh; width: 100vw;">
    <div id="tabs-bar"> 
      <button id="new-tab-button">+</button>
    </div>
    <div id="tabs-content" style="flex: 1; position: relative; overflow: hidden;"></div>
  </div>
</body>

</html>
